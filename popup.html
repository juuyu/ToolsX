<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <title>Tools-X</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="pop">
    <header class="pop-head">
      <div class="brand">
        <div class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7" stroke="#FAF9F5" stroke-width="2.4" stroke-linecap="round">
            </path>
          </svg>
        </div>
        <h1>Tools-X</h1>
      </div>
      <div class="status"><span class="dot"></span>本地</div>
    </header>

    <main class="tools">
      <button class="tool" data-tool="todo">
        <span class="t-ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M9 11l3 3L22 4"></path>
            <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"></path>
          </svg>
        </span>
        <span class="t-body"><b>Todo</b></span>
        <span class="t-go">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </span>
      </button>
      <button class="tool" data-tool="json">
        <span class="t-ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M8 3H7a2 2 0 00-2 2v5a2 2 0 01-2 2 2 2 0 012 2v5c0 1.1.9 2 2 2h1"></path>
            <path d="M16 3h1a2 2 0 012 2v5a2 2 0 002 2 2 2 0 00-2 2v5a2 2 0 01-2 2h-1"></path>
          </svg>
        </span>
        <span class="t-body"><b>JSON</b></span>
        <span class="t-go">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </span>
      </button>
      <button class="tool" data-tool="docs">
        <span class="t-ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 016.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"></path>
          </svg>
        </span>
        <span class="t-body"><b>Docs</b></span>
        <span class="t-go">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </span>
      </button>
      <button class="tool" data-tool="api">
        <span class="t-ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M22 2L11 13"></path>
            <path d="M22 2l-7 20-4-9-9-4 20-7z"></path>
          </svg>
        </span>
        <span class="t-body"><b>Postman</b></span>
        <span class="t-go">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </span>
      </button>
    </main>
  </div>
  <script src="popup.js"></script>
</body>

</html>
